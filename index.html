<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuarios Avanzado</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="form-container">
        <h2>Registro de Usuarios</h2>
        <p>Completa los campos para crear tu cuenta. La contraseña debe tener al menos 8 caracteres, incluyendo mayúsculas, minúsculas, números y símbolos.</p>
        
        <form id="registroForm" novalidate>
            <div class="form-group">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" required>
                <small class="mensaje-error"></small>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>
                <small class="mensaje-error"></small>
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
                <small class="mensaje-error">Debe tener al menos 8 caracteres, una mayúscula, una minúscula, un número y un símbolo.</small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar contraseña:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
                <small class="mensaje-error"></small>
            </div>

            <button type="submit">Registrar</button>
        </form>

        <p id="mensaje"></p>
    </div>
</body>
</html>
